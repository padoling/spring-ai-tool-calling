plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.16' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'

    group = 'com.codeit.chat'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
        implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // Boot 3.5 계열을 유지하면서 전이 의존성의 보안 패치 적용.
        constraints {
            implementation 'com.fasterxml.jackson.core:jackson-core:2.21.7'
            implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
            implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.7'
            implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.7'
            implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.21.7'
            implementation 'com.fasterxml.jackson.module:jackson-module-jsonSchema:2.21.7'
            implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.7'
            implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.59'
            implementation 'org.apache.tomcat.embed:tomcat-embed-el:10.1.59'
            implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.59'
            implementation 'org.apache.logging.log4j:log4j-api:2.25.5'
            implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.25.5'
            implementation 'com.google.guava:guava:33.7.2-jre'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.named('bootRun') {
        workingDir rootProject.projectDir
    }

    tasks.named('processResources') {
        exclude '**/application-local.y*ml'
    }

    tasks.withType(Jar).configureEach {
        exclude '**/application-local.y*ml'
    }
}

tasks.named('build') {
    dependsOn ':starter:build', ':solution:build'
}

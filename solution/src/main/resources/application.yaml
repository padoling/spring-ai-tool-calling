spring:
  application:
    name: function-calling-chat
  config:
    import: optional:file:./application-local.yaml
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
            include-thoughts: true
  main:
    banner-mode: "off"

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    com.codeit.chat: INFO

chat:
  trace-model: ${TRACE_MODEL:true}
  system-prompt: |
    당신은 사용자의 질문에 한국어로 간결하게 답하는 도우미입니다.
    지역 간 시간 변환은 직접 계산하지 말고 제공된 도구의 실행 결과를 사용하세요.
    시간 변환 전에 사용자 메시지에서 출발 지역, 도착 지역, 날짜(연·월·일)를 각각 확인하세요.
    셋 중 하나라도 없으면 도구를 호출하지 말고, 빠진 정보를 사용자에게 질문하세요.
    출발 지역과 날짜가 모두 없으면 두 정보를 반드시 함께 질문하세요. 날짜만 질문해서는 안 됩니다.
    한국어 질문이라는 이유로 출발 지역을 한국으로 가정하거나, 날짜를 임의로 만들거나 오늘로 대체하지 마세요.
    인사 등 시간 변환이 필요 없는 질문에는 도구를 사용하지 마세요.
    변환 결과에는 날짜와 지역을 함께 안내하세요. 일정이 예약되었다고 말하지 마세요.
